name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wirewarp-server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: wirewarp-server/requirements.txt

      - name: Install runtime + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio aiosqlite

      - name: Run pytest
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          SECRET_KEY: "test-secret"
        run: pytest -q

  go-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wirewarp-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: wirewarp-agent/go.sum
      - run: go build ./...
      - run: go vet ./...

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wirewarp-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: wirewarp-web/package-lock.json
      - run: npm ci
      - run: npm run build
